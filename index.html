<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barotrauma RNG Builder</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <link rel="stylesheet" href="./css/style.css" />
  <link id="theme-style" rel="stylesheet" href="./css/themes/theme-system.css" />
  <link rel="stylesheet" href="./services/tree/tree.css" />
  <link rel="stylesheet" href="./services/db/db.css" />
  <link rel="stylesheet" href="./services/docs/docs.css" />
</head>
<body>
  <div id="app-shell">
    <header class="top-bar menu-bar">
      <div class="menu-left" role="menubar" aria-label="Main menu">
        <div class="menu-item" role="none">
          <button type="button" class="menu-button" role="menuitem" data-l10n="menuFile"></button>
          <div class="menu-dropdown" role="menu">
            <button type="button" role="menuitem" data-action="projectImport" data-l10n="projectImport"></button>
            <button type="button" role="menuitem" data-action="projectExport" data-l10n="projectExport"></button>
            <button type="button" role="menuitem" data-action="openImportXmlModal" data-l10n="importXML"></button>
            <button type="button" role="menuitem" data-action="downloadXML" data-l10n="downloadXML"></button>
            <button type="button" role="menuitem" data-action="generateXML" data-l10n="generateXML"></button>
          </div>
        </div>

        <div class="menu-item" role="none">
          <button type="button" class="menu-button" role="menuitem" data-l10n="menuEdit"></button>
          <div class="menu-dropdown" role="menu">
            <button type="button" role="menuitem" data-action="undo" data-l10n="undo"></button>
            <button type="button" role="menuitem" data-action="redo" data-l10n="redo"></button>
            <button type="button" role="menuitem" data-action="menuDeleteSelected" data-l10n="menuDeleteSelected"></button>
            <button type="button" role="menuitem" data-action="menuDuplicateSelected" data-l10n="menuDuplicateSelected"></button>
            <button type="button" role="menuitem" data-action="clearAll" data-l10n="clearEvent"></button>
          </div>
        </div>

        <div class="menu-item" role="none">
          <button type="button" class="menu-button" role="menuitem" data-l10n="menuPresets"></button>
          <div class="menu-dropdown" role="menu">
            <div class="menu-subitem" role="none">
              <button type="button" class="menu-button submenu-trigger" role="menuitem"><span data-l10n="menuBasePresets"></span> <span class="submenu-arrow">▶</span></button>
              <div class="menu-dropdown submenu" role="menu">
                <button type="button" role="menuitem" data-action="basePresetPlaceholder" data-l10n="menuOutpostMission"></button>
                <button type="button" role="menuitem" data-action="basePresetPlaceholder" data-l10n="menuWreckExpedition"></button>
              </div>
            </div>
            <div class="menu-divider" role="separator" aria-orientation="horizontal"></div>
            <button type="button" role="menuitem" data-action="loadPreset" data-l10n="loadPreset"></button>
            <button type="button" role="menuitem" data-action="savePreset" data-l10n="savePreset"></button>
            <button type="button" role="menuitem" data-action="managePreset" data-l10n="managePreset"></button>
          </div>
        </div>

        <div class="menu-item" role="none">
          <button type="button" class="menu-button" role="menuitem" data-l10n="menuTools"></button>
          <div class="menu-dropdown" role="menu">
            <button type="button" role="menuitem" data-action="runSimulation" data-l10n="simulation"></button>
            <button type="button" role="menuitem" data-action="validateTree" data-l10n="validateTree"></button>
            <button type="button" role="menuitem" data-action="probabilityAnalysis" data-l10n="probabilityAnalysis"></button>
          </div>
        </div>

        <div class="menu-item" role="none">
          <button type="button" class="menu-button" role="menuitem" data-l10n="menuView"></button>
          <div class="menu-dropdown" role="menu">
            <div class="menu-subitem" role="none">
              <button type="button" class="menu-button submenu-trigger" role="menuitem"><span data-l10n="menuTheme"></span> <span class="submenu-arrow">▶</span></button>
              <div class="menu-dropdown submenu" role="menu">
                <button type="button" role="menuitem" data-action="menuSetThemeMode" data-value="dark" data-l10n="themeModeDark"></button>
                <button type="button" role="menuitem" data-action="menuSetThemeMode" data-value="light" data-l10n="themeModeLight"></button>
              </div>
            </div>

            <div class="menu-subitem" role="none">
              <button type="button" class="menu-button submenu-trigger" role="menuitem"><span data-l10n="menuStyle"></span> <span class="submenu-arrow">▶</span></button>
              <div class="menu-dropdown submenu" role="menu">
                <button type="button" role="menuitem" data-action="menuSetBaseTheme" data-value="debug" data-l10n="themeDebug"></button>
                <button type="button" role="menuitem" data-action="menuSetBaseTheme" data-value="classic-luna" data-l10n="themeClassicLuna"></button>
                <button type="button" role="menuitem" data-action="menuSetBaseTheme" data-value="neon-ops" data-l10n="themeNeonOps"></button>
                <button type="button" role="menuitem" data-action="menuSetBaseTheme" data-value="retro-terminal" data-l10n="themeRetroTerminal"></button>
                <button type="button" role="menuitem" data-action="menuSetBaseTheme" data-value="soft-bloom" data-l10n="themeSoftBloom"></button>
              </div>
            </div>

            <div class="menu-subitem" role="none">
              <button type="button" class="menu-button submenu-trigger" role="menuitem"><span data-l10n="menuUiScale"></span> <span class="submenu-arrow">▶</span></button>
              <div class="menu-dropdown submenu" role="menu">
                <button type="button" role="menuitem" data-action="menuSetUiScale" data-value="80" data-l10n="uiScale80"></button>
                <button type="button" role="menuitem" data-action="menuSetUiScale" data-value="90" data-l10n="uiScale90"></button>
                <button type="button" role="menuitem" data-action="menuSetUiScale" data-value="100" data-l10n="uiScale100"></button>
                <button type="button" role="menuitem" data-action="menuSetUiScale" data-value="110" data-l10n="uiScale110"></button>
                <button type="button" role="menuitem" data-action="menuSetUiScale" data-value="120" data-l10n="uiScale120"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="menu-item" role="none">
          <button type="button" class="menu-button" role="menuitem" data-l10n="menuHelp"></button>
          <div class="menu-dropdown" role="menu">
            <button type="button" role="menuitem" data-action="openDocumentation" data-l10n="documentation"></button>
            <button type="button" role="menuitem" data-action="openWiki" data-l10n="openWiki"></button>
            <button type="button" role="menuitem" data-action="openGithub" data-l10n="openGithub"></button>
            <button type="button" role="menuitem" data-action="reportIssue" data-l10n="reportIssue"></button>
            <button type="button" role="menuitem" data-action="aboutApp" data-l10n="aboutApp"></button>
          </div>
        </div>

        <div class="menu-item" role="none">
          <button type="button" class="menu-button" role="menuitem" data-l10n="menuSettings"></button>
          <div class="menu-dropdown" role="menu">
            <div class="menu-subitem" role="none">
              <button type="button" class="menu-button submenu-trigger" role="menuitem"><span data-l10n="language"></span> <span class="submenu-arrow">▶</span></button>
              <div class="menu-dropdown submenu" role="menu">
                <button type="button" role="menuitem" data-action="menuSetLanguage" data-value="en" data-l10n="langEnglish"></button>
                <button type="button" role="menuitem" data-action="menuLangPlaceholder" data-value="zh-Hans" data-l10n="langSimplifiedChinese"></button>
                <button type="button" role="menuitem" data-action="menuLangPlaceholder" data-value="zh-Hant" data-l10n="langTraditionalChinese"></button>
                <button type="button" role="menuitem" data-action="menuSetLanguage" data-value="ru" data-l10n="langRussian"></button>
                <button type="button" role="menuitem" data-action="menuLangPlaceholder" data-value="fr" data-l10n="langFrench"></button>
                <button type="button" role="menuitem" data-action="menuLangPlaceholder" data-value="es" data-l10n="langSpanish"></button>
                <button type="button" role="menuitem" data-action="menuLangPlaceholder" data-value="de" data-l10n="langGerman"></button>
                <button type="button" role="menuitem" data-action="menuLangPlaceholder" data-value="pl" data-l10n="langPolish"></button>
              </div>
            </div>
            <div class="menu-subitem" role="none">
              <button type="button" class="menu-button submenu-trigger" role="menuitem"><span data-l10n="openSettingsXmlBehavior"></span> <span class="submenu-arrow">▶</span></button>
              <div class="menu-dropdown submenu" role="menu">
                <button type="button" role="menuitem" data-action="openImportXmlModal" data-l10n="importXML"></button>
                <button type="button" role="menuitem" data-action="downloadXML" data-l10n="downloadXML"></button>
                <button type="button" role="menuitem" data-action="generateXML" data-l10n="generateXML"></button>
              </div>
            </div>
            <button type="button" role="menuitem" data-action="resetSettings" data-l10n="resetSettings"></button>
          </div>
        </div>
      </div>

      <div class="menu-right">
        <button data-action="openDB" data-action-tier="secondary" data-l10n="database"></button>
        <button data-action="openDocumentation" data-action-tier="secondary" data-l10n="documentation"></button>
        <div id="editor-mode-segmented" class="segmented-control segmented-control-three" data-editor-mode="basic" data-segment-count="3" role="tablist" data-l10n-aria-label="editorOperationMode">
          <div class="segmented-control-indicator" aria-hidden="true"></div>
          <button type="button" class="segmented-option active" data-action="setEditorMode" data-editor-mode-option="true" data-mode="basic" role="tab" aria-selected="true" data-l10n="editorModeBasic"></button>
          <button type="button" class="segmented-option" data-action="setEditorMode" data-editor-mode-option="true" data-mode="intermediate" role="tab" aria-selected="false" data-l10n="editorModeIntermediate"></button>
          <button type="button" class="segmented-option" data-action="setEditorMode" data-editor-mode-option="true" data-mode="advanced" role="tab" aria-selected="false" data-l10n="editorModeAdvanced"></button>
        </div>
        <div id="view-segmented" class="segmented-control" data-view-mode="node" data-segment-count="2" role="tablist" data-l10n-aria-label="editorViewMode">
          <div class="segmented-control-indicator" aria-hidden="true"></div>
          <button type="button" class="segmented-option active" data-action="setViewMode" data-view-mode="node" role="tab" aria-selected="true" data-l10n="nodeMode"></button>
          <button type="button" class="segmented-option" data-action="setViewMode" data-view-mode="tree" role="tab" aria-selected="false" data-l10n="treeMode"></button>
        </div>
      </div>
    </header>

    <section id="settings-panel" class="settings-panel floating-panel">
      <div class="settings-grid">
        <label><span data-l10n="theme"></span>
          <select id="base-theme-select">
            <option value="debug" data-l10n="themeDebug">Normal</option>
            <option value="classic-luna" data-l10n="themeClassicLuna">Classic Luna</option>
            <option value="neon-ops" data-l10n="themeNeonOps">Neon Ops</option>
            <option value="retro-terminal" data-l10n="themeRetroTerminal">Retro Terminal</option>
            <option value="soft-bloom" data-l10n="themeSoftBloom">Soft Bloom</option>
          </select>
        </label>
        <label><span data-l10n="themeMode"></span>
          <select id="theme-mode-select">
            <option value="dark" data-l10n="themeModeDark">Dark</option>
            <option value="light" data-l10n="themeModeLight">Light</option>
          </select>
        </label>
        <label><span data-l10n="language"></span>
          <select id="lang-select">
            <option value="en" data-l10n="langEnglish">English</option>
            <option value="ru" data-l10n="langRussian">Русский</option>
          </select>
        </label>
        <label><span data-l10n="uiScale"></span>
          <select id="ui-scale-select">
            <option value="90" data-l10n="uiScale90">90%</option>
            <option value="100" data-l10n="uiScale100">100%</option>
            <option value="110" data-l10n="uiScale110">110%</option>
            <option value="125" data-l10n="uiScale125">125%</option>
          </select>
        </label>
        <label><span data-l10n="themeStyle"></span>
          <select id="theme-style-select">
            <option value="compact" data-l10n="themeStyleCompact">Compact</option>
            <option value="balanced" data-l10n="themeStyleBalanced">Balanced</option>
            <option value="soft" data-l10n="themeStyleSoft">Soft</option>
          </select>
        </label>
        <label class="checkbox-row"><input id="toggle-grid" type="checkbox" /><span data-l10n="grid"></span></label>
        <label class="checkbox-row"><input id="toggle-chance-colors" type="checkbox" /><span data-l10n="chanceColorCoding"></span></label>
        <label><span data-l10n="chanceInputMode"></span>
          <select id="chance-input-mode">
            <option value="fraction" data-l10n="chanceModeFraction">0..1</option>
            <option value="percent" data-l10n="chanceModePercent">%</option>
          </select>
        </label>
        <label><span data-l10n="autoChanceMode"></span>
          <select id="auto-chance-global">
            <option value="off" data-l10n="autoChanceOff">Off</option>
            <option value="root-split" data-l10n="autoChanceRoot">Root</option>
            <option value="branch-split" data-l10n="autoChanceBranch">Branch</option>
          </select>
        </label>
        <button id="clear-cache-btn" type="button" data-l10n="clearCache"></button>
      </div>
    </section>

    <section class="action-bar">
      <div class="action-group">
        <span class="action-title" data-l10n="build"></span>
        <button data-action="addNode" data-action-tier="secondary" data-type="rng" data-node-type="rng" data-l10n="addRng"></button>
        <button data-action="addNode" data-action-tier="secondary" data-type="event" data-node-type="event" data-l10n="addEvent"></button>
        <button data-action="addNode" data-action-tier="secondary" data-type="eventSet" data-node-type="eventSet" data-l10n="addEventSet"></button>
        <button data-action="addNode" data-action-tier="secondary" data-type="spawn" data-node-type="spawn" data-l10n="addItem"></button>
        <button data-action="addNode" data-action-tier="secondary" data-type="creature" data-node-type="creature" data-l10n="addCreature"></button>
        <button data-action="addNode" data-action-tier="secondary" data-type="affliction" data-node-type="affliction" data-l10n="addAffliction"></button>
      </div>

      <div class="action-group history-group">
        <button data-action="undo" data-action-tier="neutral" data-l10n="undo"></button>
        <button data-action="redo" data-action-tier="neutral" data-l10n="redo"></button>
      </div>
    </section>

    <main id="main-container">
      <section id="editor-area">
        <div id="events-tabs" class="events-tabs"></div>
        <div id="classic-view">
          <div id="tree-root" class="node-root">
            <strong data-l10n="rootEvent"></strong>
            <div id="root-children"></div>
          </div>
        </div>
        <div id="tree-container" style="display:none;">
          <div class="tree-layout">
            <section id="tree-outline" class="tree-outline" data-l10n-aria-label="treeOutlineLabel"></section>
            <svg id="tree-svg" aria-hidden="true"></svg>
            <aside id="tree-inspector"></aside>
          </div>
        </div>
      </section>
      <section id="documentation-view" hidden></section>
    </main>

    <section id="output-panel" class="output-panel">
      <div class="output-panel-header">
        <button id="output-collapse-toggle" type="button" data-action="toggleOutputCollapse" data-action-tier="neutral" class="output-collapse-btn"></button>
        <div class="output-tabs" role="tablist" data-l10n-aria-label="outputTabsLabel">
          <div class="output-tabs-indicator" aria-hidden="true"></div>
          <button type="button" class="output-tab active" data-action="openOutputTab" data-tab="xml" role="tab" aria-selected="true" data-l10n="outputXmlTab"></button>
          <button type="button" class="output-tab" data-action="openOutputTab" data-tab="simulation" role="tab" aria-selected="false" data-l10n="simulation"></button>
        </div>
        <div class="output-header-controls">
          <label class="header-search-bar" for="simulation-search">
            <span data-l10n="search"></span>
            <input id="simulation-search" type="text" data-l10n-placeholder="searchNodes" placeholder="Search Nodes" />
          </label>
          <div class="event-id-bar">
            <label for="event-id" data-l10n="eventId"></label>
            <input id="event-id" value="event_1" />
          </div>
        </div>
      </div>

      <div class="output-panel-body">
        <section id="xml-output-pane" class="output-pane active" data-output-pane="xml">
          <textarea id="output" spellcheck="false"></textarea>
          <div class="xml-pane-actions">
            <button data-action="generateXML" data-action-tier="primary" data-l10n="generateXML"></button>
          </div>
        </section>

        <section id="simulation-output-pane" class="output-pane" data-output-pane="simulation">
          <div class="simulation-controls-panel">
            <div class="simulation-control-grid">
              <label class="simulation-control-row inline-control-row">
                <span data-l10n="iterations"></span>
                <input id="simulation-iterations" type="number" min="1" max="200000" step="100" value="10000" />
              </label>
              <label class="simulation-control-row inline-control-row">
                <span data-l10n="seed"></span>
                <input id="simulation-seed" type="text" placeholder="random" />
              </label>
              <button type="button" class="simulation-run-btn" data-action="runSimulation" data-action-tier="primary" data-l10n="runSimulation"></button>
            </div>
          </div>
          <div class="simulation-table-wrap">
            <table class="simulation-table">
              <thead>
                <tr>
                  <th data-l10n="result"></th>
                  <th data-l10n="count"></th>
                  <th id="sim-prob-header" data-action="toggleSimulationSort"><span data-l10n="simulatedProbability"></span></th>
                  <th data-l10n="exactProbability"></th>
                </tr>
              </thead>
              <tbody id="simulation-results"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </div>

  <div id="import-xml-modal" class="about-modal import-xml-modal" hidden>
    <div class="about-modal-backdrop" data-role="close-import-xml"></div>
    <section class="about-modal-panel import-xml-panel" role="dialog" aria-modal="true" aria-labelledby="import-xml-title">
      <div class="import-xml-header">
        <div>
          <h3 id="import-xml-title" data-l10n="importXML"></h3>
          <p data-l10n="importXmlPlaceholderDescription"></p>
        </div>
        <button type="button" data-role="close-import-xml" data-l10n="close">Close</button>
      </div>
      <div class="import-xml-layout">
        <label class="import-xml-dropzone" for="import-xml-file">
          <input id="import-xml-file" type="file" accept=".xml,text/xml,application/xml" hidden />
          <strong data-l10n="importXmlDropTitle"></strong>
          <span data-l10n="importXmlDropHint"></span>
          <span class="import-xml-file-name" id="import-xml-file-name" data-l10n="importXmlNoFile"></span>
        </label>
        <label class="import-xml-textbox">
          <span data-l10n="importXmlPasteLabel"></span>
          <textarea id="import-xml-textarea" spellcheck="false" data-l10n-placeholder="importXmlPastePlaceholder"></textarea>
        </label>
      </div>
      <div class="import-xml-actions">
        <button type="button" data-role="import-xml-placeholder" data-action-tier="primary" data-l10n="importXmlActionPlaceholder"></button>
      </div>
    </section>
  </div>

  <script type="module">
    import { initEditorUI } from './ui/ui-controller.js';

    function renderStartupError(error) {
      console.error('Failed to initialize app', error);
      const fallback = document.createElement('div');
      fallback.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:2rem;background:#111;color:#f4f4f4;font:500 16px/1.5 system-ui,sans-serif;z-index:9999;text-align:center;';
      fallback.innerHTML = '<div><h2 style="margin:0 0 12px;">Application failed to start</h2><p style="margin:0 0 6px;opacity:.9;">Please reload the page or clear local storage for this site.</p><p style="margin:0;opacity:.75;font-size:14px;">Ошибка запуска приложения. Попробуйте перезагрузить страницу или очистить localStorage для сайта.</p></div>';
      document.body.appendChild(fallback);
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        initEditorUI();
      } catch (error) {
        renderStartupError(error);
      }
    });
  </script>
</body>
</html>
